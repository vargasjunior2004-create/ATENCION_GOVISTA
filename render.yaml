services:
  - type: web
    name: salestracker
    runtime: python
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt && bash build.sh
    buildCommand: pip install -r requirements.txt && bash build.sh
    startCommand: python manage.py collectstatic --clear --noinput && python manage.py migrate --noinput && gunicorn salestracker.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: SERVE_FRONTEND
        value: "true"
      # DATABASE_URL NO se define aqui a proposito: la credencial vive
      # unicamente en el panel de Render (Environment). Definirla en este
      # archivo haria que el Blueprint sobrescriba el valor del panel.
      # La app puede usar el transaction pooler (6543), que es lo recomendado
      # para un backend web.
      #
      # BACKUP_DATABASE_URL es OBLIGATORIA para los respaldos: pg_dump
      # necesita una sesion estable y el transaction pooler reparte cada
      # sentencia en una conexion distinta, por lo que fallaria.
      # Debe apuntar al Session pooler (puerto 5432) y usar el usuario
      # con formato postgres.<project-ref>. Se define manualmente en el
      # panel de Render, junto a DATABASE_URL.
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
