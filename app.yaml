# Configuración de despliegue para Wasmer Edge (https://wasmer.io)
kind: wasmer.io/App.v0
owner: vargasjunior2004-create
name: salestracker
package: vargasjunior2004-create/salestracker
debug: false
env:
  DJANGO_DEBUG: "false"
  SQLITE_PATH: "/data/db.sqlite3"
  WASMER: "true"
# Volumen persistente para SQLite (el nombre NO debe cambiarse nunca)
volumes:
  - name: data
    mount: /data
# SQLite necesita un solo escritor a la vez
scaling:
  mode: single_concurrency
